name: build

on:
  push:
    branches: [fsr-frame-generation]
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Native worker (nvngx.dll + forwarder)
        shell: cmd
        run: call native\build-host.bat
      - name: Launcher (NeuralScreen.exe)
        shell: cmd
        run: call native\build-launcher.bat
      - name: Verify the build outputs exist
        shell: bash
        run: |
          for f in native/nvngx.dll native/nvngx.dll_ns-forwarder.dll NeuralScreen.exe \
                   native/amd_fidelityfx_loader_dx12.dll native/amd_fidelityfx_framegeneration_dx12.dll; do
            test -s "$f" || { echo "MISSING: $f"; exit 1; }
            ls -l "$f"
          done
      - name: Python tests (no GPU)
        shell: bash
        env:
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy
        run: |
          python -m pip install numpy pygame
          rc=0
          for t in test_fg_multiplier_stepdown test_framegen_controls test_fg_row_fits test_i18n_translated; do
            echo "== $t"
            if ! python tests/$t.py > "$t.out" 2>&1; then
              rc=1
              msg=$(tail -n 8 "$t.out" | tr '\n' '|' | cut -c1-900)
              echo "::error title=$t failed::$msg"
            fi
          done
          exit $rc
      - uses: actions/upload-artifact@v4
        with:
          name: neuralscreen-build
          path: |
            NeuralScreen.exe
            native/nvngx.dll
            native/nvngx.dll_ns-forwarder.dll
            native/amd_fidelityfx_loader_dx12.dll
            native/amd_fidelityfx_framegeneration_dx12.dll
