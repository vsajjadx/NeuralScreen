name: build-native
on:
  push:
    branches: [main, fsr-fg-test]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Python sources compile
        shell: cmd
        run: python -m compileall -q app main.py build_release_zip.py verify_github.py
      - name: Build the worker (nvngx.dll + forwarder)
        shell: cmd
        run: call native\build-host.bat
      - name: Build the launcher
        shell: cmd
        run: call native\build-launcher.bat
      - name: Build the Spout adapter check
        shell: cmd
        run: call native\build-spout-adapter.bat
      - name: Build the Spout compile check
        shell: cmd
        run: call native\build-spout-check.bat
      - name: Build the Spout sender and receiver
        shell: cmd
        run: call native\build-spout-test.bat
      - name: Build the GPU recorder check
        shell: cmd
        run: call native\build-gpu-recorder-check.bat
      - name: Fetch the AMD FSR runtime
        shell: cmd
        run: call native\fetch-fsr-runtime.bat
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Frame generation tests (no GPU)
        shell: bash
        env:
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy
        run: |
          python -m pip install numpy pygame opencv-python-headless pillow av comtypes pystray
          rc=0
          for t in test_fg_multiplier_stepdown test_framegen_controls test_fg_row_fits test_fg_bypass_present; do
            echo "== $t"
            if ! python tests/$t.py > "$t.out" 2>&1; then
              rc=1
              msg=$(tail -n 3 "$t.out" | tr '\n' '|' | cut -c1-900)
              echo "::error title=$t failed::$msg"
            fi
          done
          exit $rc
      # A build script that "succeeds" without producing its file must not pass.
      - name: Verify every native output exists
        shell: pwsh
        run: |
          $need = @(
            'native/nvngx.dll',
            'native/nvngx.dll_ns-forwarder.dll',
            'native/amd_fidelityfx_loader_dx12.dll',
            'native/amd_fidelityfx_framegeneration_dx12.dll',
            'native/spout_adapter_check.exe',
            'native/spout_check.exe',
            'native/spout_sender.exe',
            'native/spout_receiver.exe',
            'native/gpu_recorder_check.exe',
            'NeuralScreen.exe')
          $missing = $need | Where-Object { -not (Test-Path $_) }
          if ($missing) { Write-Error ('missing native outputs: ' + ($missing -join ', ')); exit 1 }
          $need | ForEach-Object { '{0,12:N0}  {1}' -f (Get-Item $_).Length, $_ }
      # The update package: every tracked file (app, main.py, native sources,
      # config, docs) with the built binaries laid over it. Extract it over an
      # existing install; runtime\ (embedded Python) and nvngx_dlssnr.dll are
      # not in the repository and stay as the install has them.
      - name: Assemble the code package (intermediate; the only deliverable is the full zip)
        shell: pwsh
        run: |
          git archive --format=zip --prefix=NeuralScreen/ -o ns-src.zip HEAD
          Expand-Archive ns-src.zip -DestinationPath pkg
          Copy-Item native/*.dll, native/*.exe pkg/NeuralScreen/native/ -Force
          Copy-Item NeuralScreen.exe pkg/NeuralScreen/ -Force
          Compress-Archive -Path pkg/NeuralScreen -DestinationPath neuralscreen-update.zip
          '{0:N0} bytes' -f (Get-Item neuralscreen-update.zip).Length
      # The full package: the update package plus the runtime (embedded
      # Python) and the NVIDIA DLLs, which are too large for the main tree
      # and live, split in parts, on the `payload` branch.
      - uses: actions/checkout@v4
        with:
          ref: payload
          path: payload
      - name: Build the FULL package (update package + runtime + NVIDIA DLLs)
        shell: pwsh
        run: |
          Push-Location payload
          $parts = Get-ChildItem payload.zip.part* | Sort-Object Name
          $out = [System.IO.File]::Create("$PWD/../payload.zip")
          foreach ($p in $parts) { $b = [System.IO.File]::ReadAllBytes($p.FullName); $out.Write($b, 0, $b.Length) }
          $out.Close()
          Pop-Location
          New-Item -ItemType Directory -Force full | Out-Null
          Expand-Archive -Path neuralscreen-update.zip -DestinationPath full -Force
          Expand-Archive -Path payload.zip -DestinationPath payload_x -Force
          Copy-Item -Recurse -Force payload_x/runtime full/NeuralScreen/runtime
          Copy-Item -Force payload_x/nvngx_dlssnr.dll, payload_x/nvngx_dlssg.dll full/NeuralScreen/native/
          if (-not (Test-Path full/NeuralScreen/runtime/python.exe)) { throw "runtime/python.exe missing" }
          if (-not (Test-Path full/NeuralScreen/native/nvngx_dlssnr.dll)) { throw "nvngx_dlssnr.dll missing" }
          Compress-Archive -Path full/NeuralScreen -DestinationPath NeuralScreen-full.zip -CompressionLevel Fastest
          '{0:N0} bytes' -f (Get-Item NeuralScreen-full.zip).Length
      # A direct download link that needs no GitHub login: the Actions
      # artifact page only serves signed-in users and expires.
      - name: Publish the packages as a release (direct download)
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "build-$env:GITHUB_RUN_NUMBER-$($env:GITHUB_REF_NAME -replace '[^A-Za-z0-9._-]', '-')"
          gh release create $tag NeuralScreen-full.zip `
            --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA `
            --prerelease --title "NeuralScreen $tag" `
            --notes "Build of $env:GITHUB_REF_NAME at $env:GITHUB_SHA. NeuralScreen-full.zip is complete: unzip and run NeuralScreen.exe."
          "https://github.com/$env:GITHUB_REPOSITORY/releases/tag/$tag"
