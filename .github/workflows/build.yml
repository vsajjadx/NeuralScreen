name: build

on:
  push:
    branches: [fsr-frame-generation]
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Native worker (nvngx.dll + forwarder)
        shell: cmd
        run: call native\build-host.bat
      - name: Launcher (NeuralScreen.exe)
        shell: cmd
        run: call native\build-launcher.bat
      - name: Python tests (no GPU)
        shell: cmd
        env:
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy
        run: |
          python -m pip install numpy pygame
          python tests\test_fg_multiplier_stepdown.py
          python tests\test_framegen_controls.py
          python tests\test_fg_row_fits.py
          python tests\test_i18n_translated.py
      - uses: actions/upload-artifact@v4
        with:
          name: neuralscreen-build
          path: |
            NeuralScreen.exe
            native/nvngx.dll
            native/nvngx.dll_ns-forwarder.dll
            native/amd_fidelityfx_loader_dx12.dll
            native/amd_fidelityfx_framegeneration_dx12.dll
