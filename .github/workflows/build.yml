name: build-native
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Python sources compile
        shell: cmd
        run: python -m compileall -q app main.py build_release_zip.py verify_github.py
      - name: Build the worker (nvngx.dll + forwarder)
        shell: cmd
        run: call native\build-host.bat
      - name: Build the launcher
        shell: cmd
        run: call native\build-launcher.bat
      - name: Build the Spout adapter check
        shell: cmd
        run: call native\build-spout-adapter.bat
      - name: Build the Spout compile check
        shell: cmd
        run: call native\build-spout-check.bat
      - name: Build the Spout sender and receiver
        shell: cmd
        run: call native\build-spout-test.bat
      - name: Build the GPU recorder check
        shell: cmd
        run: call native\build-gpu-recorder-check.bat
      - name: Fetch the AMD FSR runtime
        shell: cmd
        run: call native\fetch-fsr-runtime.bat
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Frame generation tests (no GPU)
        shell: bash
        env:
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy
        run: |
          python -m pip install numpy pygame opencv-python-headless pillow av comtypes pystray
          rc=0
          for t in test_fg_multiplier_stepdown test_framegen_controls test_fg_row_fits test_fg_bypass_present test_i18n_translated; do
            echo "== $t"
            if ! python tests/$t.py > "$t.out" 2>&1; then
              rc=1
              msg=$(tail -n 3 "$t.out" | tr '\n' '|' | cut -c1-900)
              echo "::error title=$t failed::$msg"
            fi
          done
          exit $rc
      # A build script that "succeeds" without producing its file must not pass.
      - name: Verify every native output exists
        shell: pwsh
        run: |
          $need = @(
            'native/nvngx.dll',
            'native/nvngx.dll_ns-forwarder.dll',
            'native/amd_fidelityfx_loader_dx12.dll',
            'native/amd_fidelityfx_framegeneration_dx12.dll',
            'native/spout_adapter_check.exe',
            'native/spout_check.exe',
            'native/spout_sender.exe',
            'native/spout_receiver.exe',
            'native/gpu_recorder_check.exe',
            'NeuralScreen.exe')
          $missing = $need | Where-Object { -not (Test-Path $_) }
          if ($missing) { Write-Error ('missing native outputs: ' + ($missing -join ', ')); exit 1 }
          $need | ForEach-Object { '{0,12:N0}  {1}' -f (Get-Item $_).Length, $_ }
      # The update package: every tracked file (app, main.py, native sources,
      # config, docs) with the built binaries laid over it. Extract it over an
      # existing install; runtime\ (embedded Python) and nvngx_dlssnr.dll are
      # not in the repository and stay as the install has them.
      - name: Assemble the update package
        shell: pwsh
        run: |
          git archive --format=zip --prefix=NeuralScreen/ -o ns-src.zip HEAD
          Expand-Archive ns-src.zip -DestinationPath pkg
          Copy-Item native/*.dll, native/*.exe pkg/NeuralScreen/native/ -Force
          Copy-Item NeuralScreen.exe pkg/NeuralScreen/ -Force
          Compress-Archive -Path pkg/NeuralScreen -DestinationPath neuralscreen-update.zip
          '{0:N0} bytes' -f (Get-Item neuralscreen-update.zip).Length
      - uses: actions/upload-artifact@v4
        with:
          name: neuralscreen-update-package
          if-no-files-found: error
          path: neuralscreen-update.zip
      - uses: actions/upload-artifact@v4
        with:
          name: neuralscreen-native
          if-no-files-found: error
          path: |
            native/nvngx.dll
            native/nvngx.dll_ns-forwarder.dll
            native/amd_fidelityfx_loader_dx12.dll
            native/amd_fidelityfx_framegeneration_dx12.dll
            native/spout_adapter_check.exe
            native/spout_check.exe
            native/spout_sender.exe
            native/spout_receiver.exe
            native/gpu_recorder_check.exe
            NeuralScreen.exe

  # Rolls the build just made into the previous full package (runtime + the
  # NVIDIA dll are not in the repository, so the last full release carries
  # them) and publishes it as the new latest NeuralScreen-full.zip. The shadPS4
  # bundle takes its embedded copy from there; a double-click install can use
  # it the same way.
  bundle-release:
    needs: windows
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download the update package
        uses: actions/download-artifact@v4
        with:
          name: neuralscreen-update-package

      - name: Roll the update into the full package
        run: |
          curl -fL --retry 3 -o full.zip \
            "https://github.com/vsajjadx/NeuralScreen/releases/latest/download/NeuralScreen-full.zip"
          mkdir full update
          unzip -q full.zip -d full
          unzip -q neuralscreen-update.zip -d update
          cp -a update/NeuralScreen/. full/
          rm -f full.zip
          (cd full && zip -qr ../NeuralScreen-full.zip .)
          "rolled: $(du -h NeuralScreen-full.zip | cut -f1)"

      - name: Publish as the latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="build-${GITHUB_RUN_NUMBER}-main"
          gh release create "$tag" NeuralScreen-full.zip \
            --repo "$GITHUB_REPOSITORY" \
            --title "NeuralScreen $tag" \
            --notes "Automated full package: the previous full release with main build ${GITHUB_RUN_NUMBER} (shadPS4 DLSS5 integration) rolled in. Extract over an install or use it as the install."
