name: build-native
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Python sources compile
        shell: cmd
        run: python -m compileall -q app main.py build_release_zip.py verify_github.py
      - name: Build the worker (nvngx.dll + forwarder)
        shell: cmd
        run: call native\build-host.bat
      - name: Build the launcher
        shell: cmd
        run: call native\build-launcher.bat
      - name: Fetch the AMD FSR runtime
        shell: cmd
        run: call native\fetch-fsr-runtime.bat
      - uses: actions/upload-artifact@v4
        with:
          name: neuralscreen-native
          path: |
            native/nvngx.dll
            native/nvngx.dll_ns-forwarder.dll
            native/amd_fidelityfx_loader_dx12.dll
            native/amd_fidelityfx_framegeneration_dx12.dll
            NeuralScreen.exe
